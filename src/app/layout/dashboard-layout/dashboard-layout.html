<div class="flex h-screen w-full overflow-hidden">
  
  <aside class="w-64 flex-none bg-gray-100 border-r border-gray-200">
    <div class="p-6">
      <p class="font-bold text-gray-700">Fixed Sidebar </p>
    </div>
  </aside>

  <div class="flex flex-1 flex-col h-full bg-white">
    
    <header class="h-fit flex px-8 py-3 border-b border-gray-200 z-40 justify-end item-center">
        <div class="w-49 flex justify-end gap-4">
            <div class="w-47 flex justify-end gap-3 p1-4 items-center">
                <div class="flex justify-end flex-col">
                    @if(viewData){
                        <h4 class="text-sm text-end font-bold leading-5 capitalize">{{ userData.name }}</h4>
                        <p class="text-end text-primary fond-bold text-[10px] tracking-[1px] leading-5 uppercase">{{userData.department}}</p>
                    }
                </div>
                <div class="w-10 h-10 bg-primary-container rounded rounded-lg flex items-center justify-center">
                    @if(viewData){
                        <div class="font-bold text-base leading-6 text-white">
                            {{userData.nameInitials}}
                        </div>
                    }
                    
                </div>

            </div>

        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-8">
      <router-outlet></router-outlet>
    </main>
    
  </div>
</div>
